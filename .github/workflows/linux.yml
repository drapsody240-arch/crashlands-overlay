# Builds the Linux overlay (AppImage) from this source, after checking the Linux native module under a virtual X display.
# Run it from the Actions tab (Run workflow); the AppImage is attached to the run. The official download is the same
# build, signed by CrashLands, from the Overlay page on players.crashlands.online.
name: Linux build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libxi6 libfuse2
      - run: npm ci
      - name: Native module check
        run: xvfb-run -a node tools/smoke-linux.cjs
      - name: Build the AppImage
        run: npm run dist:linux
      - name: Start-up check (runs 20 s under Xvfb without crashing)
        run: |
          set +e
          xvfb-run -a timeout 20 release/linux-unpacked/crashlands-overlay --no-sandbox > run.log 2>&1
          code=$?; cat run.log
          if [ $code -ne 124 ]; then echo "exited early with $code"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/latest-linux.yml
